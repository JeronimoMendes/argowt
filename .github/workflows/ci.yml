name: ci

# Check formatting, run tests and build on pushes to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: make fmt-check

      - name: Test
        run: make test

      - name: Build
        run: make build
